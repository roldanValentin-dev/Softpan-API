services:
  postgres:
    image: postgres:16
    container_name: softpan-postgres
    environment:
      POSTGRES_USER: softpan
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: SoftpanDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - softpan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softpan -d SoftpanDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softpan-api
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=SoftpanDB;Username=softpan;Password=${DB_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-SoftpanAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-SoftpanFrontend}
      - MercadoPago__AccessToken=${MP_ACCESS_TOKEN}
      - MercadoPago__ClientSecret=${MP_CLIENT_SECRET}
      - MercadoPago__BaseUrl=${MP_BASE_URL}
      - MercadoPago__NotificationUrl=${MP_NOTIFICATION_URL}
    ports:
      - "${API_PORT:-7097}:8080"
    volumes:
      - ./images:/app/wwwroot/images
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - softpan-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  softpan-network:
    driver: bridge
